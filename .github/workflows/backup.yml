name: backup

# A weekly copy of the database, because free Supabase keeps no backups we can restore ourselves.
# The repository is public and anyone signed in to GitHub can download its artifacts, so the copy is
# encrypted with BACKUP_PASSPHRASE before it is stored. Without the passphrase the file is useless.
#
# Needs two repository secrets (DEPLOY.md, "Backups"). Until both exist the run skips and stays green.
#   SUPABASE_DB_URL     the Session pooler connection string (IPv4), with the database password in it
#   BACKUP_PASSPHRASE   a long random passphrase, kept in your password manager

on:
  schedule:
    - cron: "41 2 * * 1" # Mondays 02:41 UTC
  workflow_dispatch: # "Run workflow" button, for a backup on demand

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check the secrets are set
        id: ready
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASSPHRASE" ]; then
            echo "::notice::Backup skipped: add SUPABASE_DB_URL and BACKUP_PASSPHRASE (DEPLOY.md, Backups)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pg_dump 17
        if: steps.ready.outputs.ok == 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump and encrypt
        if: steps.ready.outputs.ok == 'true'
        run: |
          set -euo pipefail
          name="gecko-db-$(date -u +%Y-%m-%d)"
          # Our tables, the logins and the file records (the files themselves live in Storage and Drive).
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" \
            --format=custom --no-owner --no-privileges \
            --schema=public --schema=auth --schema=storage \
            --file="$name.dump"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --symmetric --cipher-algo AES256 --output "$name.dump.gpg" "$name.dump" 3<<<"$PASSPHRASE"
          rm "$name.dump"
          echo "NAME=$name" >> "$GITHUB_ENV"
          ls -lh "$name.dump.gpg"

      - name: Keep it for 90 days
        if: steps.ready.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.dump.gpg
          retention-days: 90
          if-no-files-found: error

name: tmp-format
# Temporary: formats the app code on this branch and commits it. Removed before merging.
on:
  push:
    branches: [writing-room]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx prettier --write src
      - run: |
          git config user.name "gecko-format"
          git config user.email "format@users.noreply.github.com"
          git add -A src
          git diff --cached --quiet || (git commit -m "Format" && git push)

name: schema-snapshot

# Compares how the live database is built with what supabase/migrations describes, so that any difference
# is known before the migration history is recorded (technical specification, A1–A3, PR 1).
#
# Two jobs:
#   expected  Every pull request touching supabase/: builds the schema from the migrations on throwaway
#             PostgreSQL 15 and 17, lists it twice and checks both listings match. No secrets, no live data.
#   live      Only when started by hand from main with target "production", and only after Heni approves the
#             run in the "production" environment. It reads the live database's system catalogs (structure,
#             never client rows) inside a read-only transaction that is rolled back, builds the expected
#             schema on the same PostgreSQL version, and compares them. The job summary shows object names
#             and short hashes only; the full report is encrypted with BACKUP_PASSPHRASE, because the
#             repository is public and anyone signed in to GitHub can download its artifacts.

on:
  pull_request:
    paths: ["supabase/**", ".github/workflows/schema-snapshot.yml"]
  workflow_dispatch:
    inputs:
      target:
        description: "expected: check the tools only. production: also read the live database's structure (needs Heni's approval)."
        type: choice
        options: [expected, production]
        default: expected

permissions:
  contents: read

concurrency:
  group: schema-snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  expected:
    name: expected schema (PostgreSQL ${{ matrix.pg }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pg: ["15", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests for the comparison script
        run: python3 -m unittest discover -s supabase/tools -p 'test_*.py' -v

      - name: Build the schema from the migrations and list it
        run: sh supabase/tools/build-expected.sh expected.raw

      - name: List it again and check both listings are identical
        run: |
          sh supabase/tools/snapshot.sh dbname=gecko_expected again.raw
          python3 supabase/tools/normalise.py listing expected.raw expected.tsv
          python3 supabase/tools/normalise.py listing again.raw again.tsv
          python3 supabase/tools/normalise.py diff expected.tsv again.tsv --summary self.md --expect-identical

      - name: Prove the read-only setting refuses writes
        run: |
          if psql -X -d gecko_expected -v ON_ERROR_STOP=1 \
              -c "set default_transaction_read_only = on" -c "create table public.ro_probe (x int)"; then
            echo "::error::A write succeeded in a read-only session."
            exit 1
          fi
          test "$(psql -X -At -d gecko_expected -c "select count(*) from pg_class where relname = 'ro_probe'")" = 0
          echo "The write was refused, as it must be."

      - uses: actions/upload-artifact@v4
        with:
          name: expected-schema-pg${{ matrix.pg }}
          path: expected.tsv
          retention-days: 30
          if-no-files-found: error

  live:
    name: live database (read-only)
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      # Running a job in an environment that has no rules would create it without any approval step.
      # This check stops the job before it touches anything unless the environment requires a reviewer.
      - name: Refuse to run unless the production environment requires approval
        env:
          REPO: ${{ github.repository }}
        run: |
          rules=$(curl -fsSL -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/environments/production" \
            | jq -r '[.protection_rules[]?.type] | join(",")') || rules=""
          case ",$rules," in
            *,required_reviewers,*) echo "The production environment requires approval." ;;
            *) echo "::error::Add a required reviewer to the production environment first (DEPLOY.md, Schema snapshot)."; exit 1 ;;
          esac

      - name: Check the secrets are set
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASSPHRASE" ]; then
            echo "::error::SUPABASE_DB_URL and BACKUP_PASSPHRASE are both needed (DEPLOY.md, Backups)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Install the PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Read the live database's structure (read-only)
        run: |
          set -euo pipefail
          sh supabase/tools/snapshot.sh "$DB_URL" live.raw
          python3 supabase/tools/normalise.py listing live.raw live.tsv
          major=$(awk -F'\t' '$1 == "fact" && $2 == "server_version_major" { print $3 }' live.tsv)
          case "$major" in ''|*[!0-9]*) echo "::error::Could not read the live PostgreSQL version."; exit 1 ;; esac
          echo "PG_MAJOR=$major" >> "$GITHUB_ENV"
          echo "Live PostgreSQL major version: $major"

      - name: Build the expected schema on the same PostgreSQL version
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          docker run -d --name expected-db -e POSTGRES_PASSWORD=postgres -p 5432:5432 "postgres:$PG_MAJOR" > /dev/null
          for i in $(seq 1 30); do pg_isready -q && break; sleep 2; done
          pg_isready
          sh supabase/tools/build-expected.sh expected.raw
          python3 supabase/tools/normalise.py listing expected.raw expected.tsv

      - name: Compare
        run: |
          python3 supabase/tools/normalise.py diff expected.tsv live.tsv --summary summary.md --full full.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Encrypt the full report
        run: |
          set -euo pipefail
          name="schema-snapshot-$(date -u +%Y-%m-%d)"
          tar czf "$name.tgz" summary.md full.md live.tsv expected.tsv
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --symmetric --cipher-algo AES256 --output "$name.tgz.gpg" "$name.tgz" 3<<<"$PASSPHRASE"
          rm -f "$name.tgz" full.md live.tsv live.raw
          echo "NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.tgz.gpg
          retention-days: 30
          if-no-files-found: error

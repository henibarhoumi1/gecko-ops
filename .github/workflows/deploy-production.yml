name: deploy-production

# Applies migrations to the LIVE database (technical specification, A1–A3). Switched off until the
# production baseline (PR 6): the job runs only when the repository variable PRODUCTION_PIPELINE is "on",
# only from main, only when started by hand, and only after Heni approves the run in the "production"
# environment. Every run starts with a fresh encrypted backup and an export of the migration history, and
# ends by checking production is built exactly as the repository says.
#
# Modes:
#   push      apply pending migrations (normal releases)
#   baseline  once, in PR 6: record the migrations that are already live (every file except those listed in
#             the "pending" input) without running them, then apply the pending ones. supabase/DRIFT.md
#             says which files are pending.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "push, or baseline (once, PR 6)"
        type: choice
        options: [push, baseline]
        default: push
      pending:
        description: "baseline only: space-separated versions NOT yet applied live (see supabase/DRIFT.md)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  production:
    if: vars.PRODUCTION_PIPELINE == 'on' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      MODE: ${{ inputs.mode }}
      PENDING: ${{ inputs.pending }}
    steps:
      - name: Refuse to run unless the production environment requires approval
        env:
          REPO: ${{ github.repository }}
        run: |
          rules=$(curl -fsSL -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/environments/production" \
            | jq -r '[.protection_rules[]?.type] | join(",")') || rules=""
          case ",$rules," in
            *,required_reviewers,*) echo "The production environment requires approval." ;;
            *) echo "::error::The production environment has no required reviewer."; exit 1 ;;
          esac
          if [ -z "$DB_URL" ] || [ -z "$PASSPHRASE" ]; then echo "::error::Secrets missing."; exit 1; fi

      - uses: actions/checkout@v4

      - name: Install the PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Fresh encrypted backup and history export
        run: |
          set -euo pipefail
          name="pre-deploy-$(date -u +%Y-%m-%d-%H%M)"
          pg_dump "$DB_URL" --format=custom --no-owner --no-privileges \
            --schema=public --schema=auth --schema=storage --file="$name.dump"
          if [ "$(psql "$DB_URL" -X -A -t -c "select to_regclass('supabase_migrations.schema_migrations') is not null")" = "t" ]; then
            psql "$DB_URL" -X -A -t -c "select version || ' ' || coalesce(name, '') from supabase_migrations.schema_migrations order by version" > "$name.history.txt"
          else
            echo "none" > "$name.history.txt"
          fi
          tar czf "$name.tgz" "$name.dump" "$name.history.txt"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --symmetric --cipher-algo AES256 --output "$name.tgz.gpg" "$name.tgz" 3<<<"$PASSPHRASE"
          rm -f "$name.dump" "$name.tgz"
          echo "NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.tgz.gpg
          retention-days: 90
          if-no-files-found: error

      - name: Baseline the history (once)
        if: env.MODE == 'baseline'
        run: |
          set -euo pipefail
          if [ "$(psql "$DB_URL" -X -A -t -c "select to_regclass('supabase_migrations.schema_migrations') is not null")" = "t" ] \
             && [ "$(psql "$DB_URL" -X -A -t -c "select count(*) from supabase_migrations.schema_migrations")" != "0" ]; then
            echo "::error::Production already has a migration history; baseline refused."; exit 1
          fi
          case "$PENDING" in *[!0-9\ ]*) echo "::error::pending must be migration versions separated by spaces"; exit 1 ;; esac
          live=""
          for v in $(ls supabase/migrations/*.sql | xargs -n1 basename | cut -d_ -f1); do
            case " $PENDING " in *" $v "*) ;; *) live="$live $v" ;; esac
          done
          echo "recording as applied (not run):$live"
          echo "pending (will run):$PENDING"
          supabase migration repair --yes --db-url "$DB_URL" --status applied $live

      - name: Show what will run
        run: supabase db push --db-url "$DB_URL" --dry-run --include-all

      - name: Apply pending migrations
        run: supabase db push --db-url "$DB_URL" --include-all --yes

      - name: Check production is built exactly as the repository says
        run: sh supabase/tools/compare-with-repo.sh "$DB_URL" "Production"

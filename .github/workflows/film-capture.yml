name: film-capture
# Captures the real client portal (fake data, web/e2e/film) at 3x for the product film. Run by hand; screenshots
# and element positions go to the film-capture-results branch.
on:
  workflow_dispatch:
  push:
    branches: [film-captures]
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: e2e-public
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: node e2e/film/capture.mjs /tmp/film-out
      - name: Push results
        if: always()
        run: |
          cd /tmp/film-out
          git init -q && git checkout -q -b film-capture-results
          git config user.name "gecko-film" && git config user.email "film@users.noreply.github.com"
          git add -A && git commit -qm "Film capture $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" film-capture-results

name: phone-check
# Opens every client portal screen and the team's Today at phone sizes against fake data (web/e2e), and
# reports anything wider than the screen. Screenshots and report.json go to the app-phone-results branch.
# Run it by hand (Actions > phone-check > Run workflow); it also runs on pull requests and merges that change
# the portal or Today screens.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: &screens ["web/src/features/portal/**", "web/src/features/today/**", "web/src/styles/**", "web/e2e/**"]
  pull_request:
    paths: *screens
permissions:
  contents: write
jobs:
  phone:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: e2e-public
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: node e2e/phone-check.mjs /tmp/phone-out
      - name: Push results
        if: always()
        run: |
          cd /tmp/phone-out
          git init -q && git checkout -q -b app-phone-results
          git config user.name "gecko-phone" && git config user.email "phone@users.noreply.github.com"
          git add -A && git commit -qm "Phone check $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" app-phone-results
